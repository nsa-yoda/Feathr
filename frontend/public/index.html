<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Feathr event platform reviewer console" />
  <title>Feathr Operations Console</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#64748b; --line:#dbe3ef; --surface:#fff; --wash:#f5f7fb; --accent:#1769aa; --good:#16794c; --warn:#a15c00; --bad:#b42318; }
    * { box-sizing:border-box; } body { margin:0; font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:var(--wash); }
    header { background:#10233f; color:#fff; padding:1.25rem clamp(1rem,4vw,3rem); display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; }
    header h1 { margin:0; font-size:1.35rem; } header p { margin:.2rem 0 0; color:#c9d7eb; }
    nav { display:flex; gap:.35rem; flex-wrap:wrap; padding:1rem clamp(1rem,4vw,3rem); background:var(--surface); border-bottom:1px solid var(--line); }
    nav button { border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:.5rem .8rem; color:var(--ink); cursor:pointer; } nav button[aria-current="page"] { background:var(--accent); color:#fff; border-color:var(--accent); }
    main { max-width:1200px; margin:0 auto; padding:1rem clamp(1rem,4vw,3rem) 3rem; } .view h2 { margin:.5rem 0 .25rem; } .lede { color:var(--muted); margin-top:0; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:.8rem; } .card { background:var(--surface); border:1px solid var(--line); border-radius:.65rem; padding:1rem; box-shadow:0 1px 2px #12213b0d; } .card h3 { margin:.1rem 0 .6rem; font-size:1rem; }
    .metric { font-size:1.5rem; font-weight:700; } .muted { color:var(--muted); } .good { color:var(--good); } .warn { color:var(--warn); } .bad { color:var(--bad); }
    form { display:grid; gap:.75rem; max-width:720px; } label { display:grid; gap:.3rem; font-weight:600; } input, textarea, select { font:inherit; padding:.55rem .65rem; border:1px solid #b8c5d6; border-radius:.4rem; color:var(--ink); background:#fff; } textarea { min-height:6rem; resize:vertical; }
    .actions { display:flex; gap:.55rem; flex-wrap:wrap; } button.primary { background:var(--accent); color:#fff; border:0; border-radius:.4rem; padding:.6rem .9rem; cursor:pointer; } button.secondary { border:1px solid var(--line); background:#fff; border-radius:.4rem; padding:.6rem .9rem; cursor:pointer; } button:disabled { opacity:.55; cursor:not-allowed; }
    .notice { padding:.7rem .8rem; border-radius:.4rem; background:#edf5ff; border-left:4px solid var(--accent); margin:.8rem 0; } .error { background:#fff1f0; border-left-color:var(--bad); } .success { background:#effaf4; border-left-color:var(--good); }
    table { width:100%; border-collapse:collapse; background:#fff; } th,td { text-align:left; padding:.55rem .6rem; border-bottom:1px solid var(--line); vertical-align:top; } th { color:var(--muted); font-size:.85rem; } pre { white-space:pre-wrap; overflow:auto; background:#f3f5f8; padding:.6rem; border-radius:.35rem; margin:.4rem 0 0; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; } @media (max-width:600px) { nav { overflow:auto; flex-wrap:nowrap; } nav button { flex:none; } th,td { padding:.45rem .35rem; } }
  </style>
</head>
<body>
  <header><div><h1>Feathr Operations Console</h1><p>Reviewer surface for event ingestion, projections, analytics, and health.</p></div><span id="connection" class="muted">Not checked</span></header>
  <nav aria-label="Primary navigation" id="nav"></nav>
  <main id="app" aria-live="polite"></main>
  <script>
    'use strict';
    const views = ['dashboard','generator','events','search','analytics','realtime','operations'];
    const state = { view:'dashboard', last:null };
    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const problem = (error) => error && typeof error === 'object' ? `${error.status || 'Error'}: ${error.detail || 'Request failed'}${error.request_id ? ` (request ${error.request_id})` : ''}` : String(error);
    async function request(path, options = {}) {
      const response = await fetch(`/api${path}`, { headers:{'Content-Type':'application/json', ...(options.headers || {})}, ...options });
      const text = await response.text(); let body = {}; const contentType=response.headers.get('content-type') || ''; try { body = contentType.includes('json') && text ? JSON.parse(text) : text; } catch { body = {detail:text}; }
      if (!response.ok) { const error = new Error(problem(body)); Object.assign(error, body, {status:response.status}); throw error; }
      return { body, response };
    }
    function boundedBurst(value) { return Math.min(20, Math.max(1, Number(value) || 1)); }
    function eventQuery(filters={}, cursor='') { const query=new URLSearchParams({limit:'50'}); if(filters.user_id) query.set('user_id',filters.user_id); if(filters.event_type) query.set('event_type',filters.event_type); if(cursor) query.set('cursor',cursor); return query.toString(); }
    function searchQuery(filters={}) { const query=new URLSearchParams({q:filters.q || 'reviewer',limit:'50'}); if(filters.event_type) query.set('event_type',filters.event_type); if(filters.user_id) query.set('user_id',filters.user_id); return query.toString(); }
    async function optionalRequest(path) { try { return (await request(path)).body; } catch (error) { return {status:error.status || 0, detail:error.detail || 'unavailable'}; } }
    function setConnection(text, className='muted') { const node = $('connection'); node.textContent = text; node.className = className; }
    function nav() { $('nav').innerHTML = views.map(v => `<button type="button" data-view="${v}" aria-current="${state.view === v ? 'page' : 'false'}">${v[0].toUpperCase()+v.slice(1)}</button>`).join(''); $('nav').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { state.view=b.dataset.view; render(); })); }
    function shell(title, lede, content) { return `<section class="view"><h2>${title}</h2><p class="lede">${lede}</p>${content}</section>`; }
    function loading() { return '<div class="notice">Loading…</div>'; }
    function errorBox(error) { return `<div class="notice error" role="alert">${esc(problem(error))}</div>`; }
    function card(title, value, detail='') { return `<article class="card"><h3>${esc(title)}</h3><div class="metric">${esc(value)}</div><div class="muted">${esc(detail)}</div></article>`; }
    function componentCards(snapshot) { const components=snapshot?.components || {}; return Object.entries(components).map(([name,value]) => card(name.replaceAll('_',' '), value?.state || 'unknown', value?.detail || '')).join(''); }
    async function dashboard() {
      $('app').innerHTML=shell('Dashboard','A bounded summary of public health and reviewer-visible state',state.last ? `${state.last}<div class="notice" role="status">Refreshing dashboard…</div>` : loading());
      try { const [{body:health},{body:metrics},{body:realtime}]=await Promise.all([request('/health/ready'),request('/metrics'),request('/events/stats/realtime?window_minutes=5')]); const content=`<div class="grid">${card('Overall status',health.status,'Readiness snapshot')}${card('Metrics','available',`${(metrics || '').toString().length || 0} characters`)}${card('Realtime',realtime.total_events,`Cache ${realtime.by_event_type ? 'available' : 'unavailable'}`)}${componentCards(health)}</div><div class="actions"><button class="secondary" id="refresh">Refresh</button></div>`; state.last=content; $('app').innerHTML=shell('Dashboard','A bounded summary of public health and reviewer-visible state',content); $('refresh').onclick=dashboard; setConnection('API reachable','good'); } catch(e) { setConnection('API degraded','warn'); if (state.last) { $('app').innerHTML=shell('Dashboard','A bounded summary of public health and reviewer-visible state',`${state.last}<div class="notice error" role="alert">Refresh failed; ${esc(problem(e))}</div><button class="secondary" id="dashboard-retry">Retry</button>`); $('refresh').onclick=dashboard; $('dashboard-retry').onclick=dashboard; } else $('app').innerHTML=shell('Dashboard','A bounded summary of public health and reviewer-visible state',errorBox(e)); }
    }
    function generator() { $('app').innerHTML=shell('Event Generator','Submit one event or a bounded demo burst. Burst requests are capped at 20.',`<form id="generator-form"><label>Event type<input name="event_type" value="reviewer.demo" required maxlength="128"></label><label>Timestamp<input name="timestamp" type="datetime-local"></label><label>User ID<input name="user_id" required maxlength="255" value="reviewer-user"></label><label>Source URL<input name="source_url" type="url" value="https://example.invalid/reviewer"></label><label>Metadata JSON<textarea name="metadata">{"source":"reviewer-ui"}</textarea></label><label>Burst count<input name="burst" type="number" min="1" max="20" value="1"></label><div class="actions"><button class="primary" type="submit">Generate event(s)</button></div></form><div id="generator-result"></div>`); $('generator-form').onsubmit=async (event) => { event.preventDefault(); const form=new FormData(event.currentTarget); const count=boundedBurst(form.get('burst')); let metadata; try { metadata=JSON.parse(form.get('metadata')); } catch { $('generator-result').innerHTML=errorBox({detail:'Metadata must be valid JSON'}); return; } const payload={event_type:form.get('event_type'), timestamp:new Date(form.get('timestamp') || Date.now()).toISOString(), user_id:form.get('user_id'), source_url:form.get('source_url'), metadata}; const results=[]; $('generator-result').innerHTML=loading(); for (let i=0;i<count;i++) { try { const {body,response}=await request('/events',{method:'POST',body:JSON.stringify(payload)}); if(response.status !== 202) throw {status:response.status,detail:'Event was not queued with HTTP 202'}; results.push(`<li class="good">202 queued: event ${esc(body.event_id)}, request ${esc(body.request_id)}</li>`); } catch (e) { results.push(`<li class="bad">${esc(problem(e))}</li>`); } } $('generator-result').innerHTML=`<div class="notice ${results.some(r=>r.includes('bad'))?'error':'success'}" role="status"><ul>${results.join('')}</ul></div>`; }; }
    async function eventsView(cursor='') {
      $('app').innerHTML=shell('Events','Canonical events with filters and bounded cursor navigation',loading());
      const filters=state.eventFilters || {}; const query=eventQuery(filters,cursor);
      try { const {body}=await request(`/events?${query}`); const items=body.items || []; const table=items.length ? `<div class="card"><table><thead><tr><th>Type</th><th>User</th><th>Timestamp</th><th>Metadata</th></tr></thead><tbody>${items.map(item=>`<tr><td>${esc(item.event_type)}</td><td>${esc(item.user_id)}</td><td>${esc(item.timestamp)}</td><td><details><summary>View</summary><pre>${esc(JSON.stringify(item.metadata || {},null,2))}</pre></details></td></tr>`).join('')}</tbody></table></div>`:'<div class="notice">No canonical events match the current page.</div>'; $('app').innerHTML=shell('Events','Canonical events with filters and bounded cursor navigation',`<form id="events-filter"><label>User ID (optional)<input name="user_id" value="${esc(filters.user_id || '')}"></label><label>Event type (optional)<input name="event_type" value="${esc(filters.event_type || '')}"></label><div class="actions"><button class="primary">Apply filters</button><button type="button" class="secondary" id="events-first">First page</button></div></form>${table}<p class="muted">Next cursor: ${esc(body.next_cursor || 'none')}</p>${body.next_cursor ? '<button class="secondary" id="events-next">Next page</button>' : ''}`); $('events-filter').onsubmit=(event)=>{event.preventDefault(); const form=new FormData(event.currentTarget); state.eventFilters={user_id:form.get('user_id'),event_type:form.get('event_type')}; eventsView();}; $('events-first').onclick=()=>eventsView(); if(body.next_cursor) $('events-next').onclick=()=>eventsView(body.next_cursor); } catch(e) { $('app').innerHTML=shell('Events','Canonical events with filters and bounded cursor navigation',errorBox(e)); }
    }
    async function searchView() { $('app').innerHTML=shell('Search','Elasticsearch projection search is eventually consistent.',`<form id="search-form"><label>Query<input name="q" value="reviewer" required></label><label>Event type (optional)<input name="event_type"></label><label>User ID (optional)<input name="user_id"></label><div class="actions"><button class="primary">Search</button></div></form><div id="search-result"></div>`); $('search-form').onsubmit=async(event)=>{event.preventDefault(); const form=new FormData(event.currentTarget); const query=searchQuery({q:form.get('q'),event_type:form.get('event_type'),user_id:form.get('user_id')}); $('search-result').innerHTML=loading(); try { const {body}=await request(`/events/search?${query}`); $('search-result').innerHTML=body.items?.length ? `<div class="card"><table><thead><tr><th>Type</th><th>User</th><th>Timestamp</th></tr></thead><tbody>${body.items.map(i=>`<tr><td>${esc(i.event_type)}</td><td>${esc(i.user_id)}</td><td>${esc(i.timestamp)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="notice">No projected events found yet.</div>'; } catch(e) { $('search-result').innerHTML=errorBox(e); } }; }
    async function analytics() { $('app').innerHTML=shell('Analytics','Counts by event type over a bounded time bucket.',`<label>Bucket<select id="bucket"><option>hour</option><option>day</option><option>week</option></select></label><div id="analytics-result">${loading()}</div>`); const load=async()=>{ try { const {body}=await request(`/events/stats?bucket=${$('bucket').value}`); $('analytics-result').innerHTML=body.points?.length ? `<div class="card"><table><thead><tr><th>Bucket</th><th>Event type</th><th>Count</th></tr></thead><tbody>${body.points.map(p=>`<tr><td>${esc(p.bucket)}</td><td>${esc(p.event_type)}</td><td>${esc(p.count)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="notice">No analytics points in this range.</div>'; } catch(e) { $('analytics-result').innerHTML=errorBox(e); } }; $('bucket').onchange=load; load(); }
    async function realtime() { $('app').innerHTML=shell('Realtime','Rolling canonical statistics with cache outcome.',loading()); try { const {body,response}=await request('/events/stats/realtime?window_minutes=5'); $('app').innerHTML=shell('Realtime','Rolling canonical statistics with cache outcome',`<div class="grid">${card('Total events',body.total_events,`Generated ${body.generated_at}`)}${card('Cache',response.headers.get('X-Cache') || 'BYPASS','X-Cache outcome')}</div><div class="card"><h3>By event type</h3><pre>${esc(JSON.stringify(body.by_event_type || {},null,2))}</pre></div><button class="secondary" id="refresh">Refresh</button>`); $('refresh').onclick=realtime; } catch(e) { $('app').innerHTML=shell('Realtime','Rolling canonical statistics with cache outcome',errorBox(e)); } }
    async function operations() { $('app').innerHTML=shell('Operations','Read-only component and dependency state. Raw payloads are intentionally hidden.',loading()); try { const [{body:health},{body:realtime},{body:metrics},rebuild]=await Promise.all([request('/health/components'),request('/events/stats/realtime?window_minutes=5'),request('/metrics'),optionalRequest('/events/search/rebuild')]); const metricText=typeof metrics==='string'?metrics:JSON.stringify(metrics); const safeMetrics=metricText.split('\n').filter(line=>/queue|worker|dlq|checkpoint|elasticsearch/i.test(line)).slice(0,12).join('\n'); $('app').innerHTML=shell('Operations','Read-only component and dependency state. Raw payloads are intentionally hidden',`<div class="grid">${componentCards(health)}${card('Realtime total',realtime.total_events,`Cache ${realtime.by_event_type ? 'available' : 'unavailable'}`)}${card('Search rebuild',rebuild.phase || 'unavailable',rebuild.completed_at || rebuild.started_at || rebuild.detail || 'No rebuild record')}</div><div class="card"><h3>Safe operational metrics</h3><pre>${esc(safeMetrics || 'No bounded queue, worker, DLQ, checkpoint, or projection metrics reported.')}</pre></div><div class="notice">Raw DLQ payloads and credentials are never rendered.</div>`); } catch(e) { $('app').innerHTML=shell('Operations','Read-only component and dependency state. Raw payloads are intentionally hidden',errorBox(e)); } }
    function render() { nav(); ({dashboard,generator,events:eventsView,search:searchView,analytics,realtime,operations}[state.view] || dashboard)(); }
    if (typeof window !== 'undefined') window.__feathrConsole = {boundedBurst,eventQuery,searchQuery,esc,problem,dashboard,generator,eventsView,searchView,analytics,realtime,operations};
    if (typeof document !== 'undefined') render();
  </script>
</body>
</html>
