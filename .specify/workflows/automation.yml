schema_version: "1.0"

workflow:
  id: "feathr-autonomous-project"
  name: "Feather Autonomous Project Completion"
  version: "1.0.0"
  author: "Juan"
  description: >
    Sequentially processes every existing Spec Kit feature through
    plan, tasks, analyze, implement, converge, verification, repair,
    and final convergence using Codex without human gates.
  integration: codex

requires:
  speckit_version: ">=1.0.4"
  integrations:
    any:
      - "codex"

inputs: {}

steps:

  # ---------------------------------------------------------------------------
  # PREFLIGHT
  # ---------------------------------------------------------------------------

  - id: require-verification-script
    type: shell
    run: |
      if [ ! -x "./scripts/verify" ]; then
        echo "ERROR: ./scripts/verify does not exist or is not executable." >&2
        echo "Create it before running this workflow." >&2
        exit 2
      fi

  # ---------------------------------------------------------------------------
  # DISCOVER SPECS
  #
  # Optional:
  #   Create .specify/spec-order.txt to explicitly control execution order.
  #
  # Example:
  #
  #   001-foundation
  #   002-auth
  #   003-users
  #   004-business-units
  #
  # If the file does not exist, specs are processed lexicographically.
  # ---------------------------------------------------------------------------

  - id: discover-specs
    type: shell
    run: |
      python3 - <<'PY'
      import json
      import pathlib
      import sys

      root = pathlib.Path.cwd()
      specs_root = root / "specs"
      order_file = root / ".specify" / "spec-order.txt"

      if not specs_root.is_dir():
          print("ERROR: specs/ directory does not exist.", file=sys.stderr)
          sys.exit(2)

      specs_root_resolved = specs_root.resolve()

      def resolve_feature(raw: str):
          value = raw.strip()

          # Ignore blanks/comments.
          if not value or value.startswith("#"):
              return None

          # Allow inline comments.
          value = value.split("#", 1)[0].strip()

          if not value:
              return None

          p = pathlib.Path(value)

          # Accept all of these:
          #
          #   001-auth
          #   specs/001-auth
          #   specs/001-auth/
          #   specs/001-auth/spec.md
          #
          if p.name == "spec.md":
              if not p.is_absolute():
                  p = root / p
              feature = p.parent
          elif value.startswith("specs/"):
              feature = root / p
          else:
              feature = specs_root / p

          try:
              resolved = feature.resolve()
              resolved.relative_to(specs_root_resolved)
          except (ValueError, OSError):
              raise ValueError(
                  f"Feature escapes specs/: {value!r}"
              )

          spec_file = resolved / "spec.md"

          if not resolved.is_dir():
              raise ValueError(
                  f"Feature directory does not exist: "
                  f"{resolved.relative_to(root)}"
              )

          if not spec_file.is_file():
              raise ValueError(
                  f"Feature does not contain spec.md: "
                  f"{resolved.relative_to(root)}"
              )

          return resolved.relative_to(root).as_posix()

      try:
          features = []

          if order_file.is_file():
              print(
                  f"Using explicit feature order from "
                  f"{order_file.relative_to(root)}",
                  file=sys.stderr
              )

              for line_number, raw in enumerate(
                  order_file.read_text(encoding="utf-8").splitlines(),
                  start=1,
              ):
                  try:
                      feature = resolve_feature(raw)
                  except ValueError as exc:
                      print(
                          f"ERROR in {order_file.relative_to(root)} "
                          f"line {line_number}: {exc}",
                          file=sys.stderr
                      )
                      print(
                          f"Raw entry: {raw!r}",
                          file=sys.stderr
                      )
                      sys.exit(4)

                  if feature:
                      features.append(feature)

          else:
              print(
                  "No .specify/spec-order.txt found; "
                  "discovering specs automatically.",
                  file=sys.stderr
              )

              features = sorted(
                  p.parent.relative_to(root).as_posix()
                  for p in specs_root.glob("*/spec.md")
              )

          # Deduplicate while preserving order.
          seen = set()
          features = [
              feature
              for feature in features
              if not (feature in seen or seen.add(feature))
          ]

          if not features:
              print(
                  "ERROR: No specs/*/spec.md files found.",
                  file=sys.stderr
              )
              sys.exit(3)

          print(
              f"Discovered {len(features)} feature(s):",
              file=sys.stderr
          )

          for i, feature in enumerate(features, 1):
              print(f"  {i:03d}. {feature}", file=sys.stderr)

          # stdout intentionally contains ONLY JSON because the next
          # workflow step parses it using from_json.
          print(json.dumps(features))

      except Exception as exc:
          print(f"ERROR: {exc}", file=sys.stderr)
          sys.exit(5)
      PY

  # ---------------------------------------------------------------------------
  # PROCESS FEATURES
  #
  # max_concurrency MUST remain 1.
  #
  # Spec Kit keeps the current feature in .specify/feature.json. Running
  # multiple features concurrently would cause them to fight over that pointer
  # and, more importantly, mutate the same source tree simultaneously.
  # ---------------------------------------------------------------------------

  - id: process-specs
    type: fan-out
    items: "{{ steps.discover-specs.output.stdout | from_json }}"
    max_concurrency: 1

    step:
      id: process-feature
      type: if
      condition: "{{ item != '' }}"

      then:

        # ---------------------------------------------------------------------
        # ACTIVATE FEATURE
        # ---------------------------------------------------------------------

        - id: activate-feature
          type: shell
          run: |
            python3 - <<'PY'
            import json
            import pathlib

            feature = "{{ item }}"

            path = pathlib.Path(".specify/feature.json")
            path.parent.mkdir(parents=True, exist_ok=True)

            path.write_text(
                json.dumps(
                    {"feature_directory": feature},
                    indent=2
                ) + "\n"
            )

            print(f"Active Spec Kit feature: {feature}")
            PY

        # ---------------------------------------------------------------------
        # PLAN
        #
        # Preserve an existing plan. Generate one only when missing.
        # ---------------------------------------------------------------------

        - id: check-plan
          type: shell
          run: 'test -f "{{ item }}/plan.md"'
          continue_on_error: true

        - id: generate-plan-if-needed
          type: if
          condition: "{{ steps.check-plan.output.exit_code != 0 }}"

          then:
            - id: generate-plan
              command: speckit.plan
              input:
                args: >
                  Produce a production-grade implementation plan for the active
                  feature. Treat spec.md and the project constitution as
                  authoritative. Inspect the existing repository before making
                  architectural decisions. Reuse established patterns where
                  appropriate. Explicitly cover architecture, APIs, persistence,
                  validation, authorization, error handling, observability,
                  migrations, backward compatibility, testing, deployment,
                  security, failure modes, edge cases, and operational concerns
                  applicable to this feature. Do not reduce or reinterpret
                  requirements merely to simplify implementation.

        # ---------------------------------------------------------------------
        # TASKS
        #
        # Preserve existing tasks. Generate only when absent.
        # ---------------------------------------------------------------------

        - id: check-tasks
          type: shell
          run: 'test -f "{{ item }}/tasks.md"'
          continue_on_error: true

        - id: generate-tasks-if-needed
          type: if
          condition: "{{ steps.check-tasks.output.exit_code != 0 }}"

          then:
            - id: generate-tasks
              command: speckit.tasks
              input:
                args: >
                  Generate an exhaustive production-grade implementation task
                  list. Every requirement, acceptance criterion, architectural
                  decision, validation rule, error condition, security
                  requirement, migration, test requirement, API contract,
                  observability requirement, documentation obligation, and
                  operational concern defined by the spec and plan must be
                  represented by actionable tasks. Include unit, integration,
                  contract, regression, and end-to-end testing wherever
                  applicable. Tasks must leave no intentionally deferred or
                  placeholder implementation.

        # ---------------------------------------------------------------------
        # ANALYZE ARTIFACTS
        # ---------------------------------------------------------------------

        - id: artifact-analysis
          command: speckit.analyze
          input:
            args: >
              Perform a strict consistency and completeness analysis. Treat
              spec.md as authoritative. Identify contradictions, omissions,
              underspecified implementation work, missing tests, uncovered edge
              cases, and requirements that are not represented in tasks.md.

        # Give Codex one autonomous artifact-remediation pass.
        #
        # spec.md remains authoritative and must not be weakened.
        # ---------------------------------------------------------------------

        - id: reconcile-artifacts
          type: prompt
          prompt: |
            Review the currently active Spec Kit feature.

            The previous speckit.analyze output is below:

            {{ steps.artifact-analysis.output.stdout }}

            Resolve legitimate artifact inconsistencies before implementation.

            Rules:

            - spec.md is the authoritative product contract.
            - Do NOT weaken, remove, narrow, or reinterpret requirements merely
              to make implementation easier.
            - Do NOT modify application source code during this step.
            - Correct plan.md and tasks.md where necessary.
            - Preserve valid architectural decisions.
            - Preserve completed task checkboxes when tasks.md already existed.
            - Add missing tasks needed to satisfy requirements.
            - Add missing test work.
            - Resolve contradictions between plan.md and spec.md in favor of
              spec.md.
            - If the analysis contains no actionable artifact problem, make no
              changes.

            Finish with the artifacts ready for unattended implementation.

        - id: artifact-analysis-after-repair
          command: speckit.analyze
          input:
            args: >
              Re-run strict consistency and completeness analysis after artifact
              reconciliation. Report any remaining issues, but do not weaken the
              specification.

        # ---------------------------------------------------------------------
        # INITIAL IMPLEMENTATION
        # ---------------------------------------------------------------------

        - id: implement
          command: speckit.implement
          input:
            args: >
              Fully implement every remaining unchecked task for the active
              feature.

              This is an unattended production implementation run.

              Requirements:

              - Do not stop after scaffolding.
              - Do not leave TODO implementations.
              - Do not leave placeholder handlers or fake persistence.
              - Do not silently skip difficult tasks.
              - Preserve existing architecture unless the approved plan requires
                a change.
              - Implement validation and error handling completely.
              - Implement authorization and security requirements completely.
              - Implement database migrations and rollback-safe behavior where
                applicable.
              - Implement observability requirements.
              - Implement all tests required by tasks.md.
              - Update generated code when required.
              - Keep API/schema/contracts synchronized with implementation.
              - Mark tasks complete only after the corresponding work actually
                exists.

              Continue until tasks.md contains no legitimately incomplete task.

        # =====================================================================
        # CONVERGENCE PASS
        #
        # converge itself exits successfully whether:
        #   A. the feature is converged
        #   B. it appended remediation tasks
        #
        # Therefore we detect convergence by hashing tasks.md before and after
        # speckit.converge.
        #
        # If tasks.md changes:
        #   converge found missing work
        #   -> implement
        #   -> converge again
        #
        # Repeat up to 8 times.
        # =====================================================================

        - id: convergence-loop
          type: do-while
          condition: "{{ steps.convergence-hash-before.output.stdout != steps.convergence-hash-after.output.stdout }}"
          max_iterations: 8

          steps:

            - id: convergence-hash-before
              type: shell
              run: |
                python3 - <<'PY'
                import hashlib
                import pathlib

                path = pathlib.Path("{{ item }}/tasks.md")
                print(hashlib.sha256(path.read_bytes()).hexdigest())
                PY

            - id: converge
              command: speckit.converge
              input:
                args: >
                  Perform a strict production-readiness convergence assessment.
                  Inspect the actual current codebase rather than assuming
                  checked tasks imply completion. Look for missing, partial,
                  contradictory, or unrequested implementation relative to
                  spec.md, plan.md, tasks.md, and the constitution. Include
                  security, authorization, validation, failure handling,
                  persistence semantics, API contracts, observability,
                  concurrency, idempotency, migrations, tests, and operational
                  behavior where applicable. Append every actionable gap as a
                  convergence task.

            - id: convergence-hash-after
              type: shell
              run: |
                python3 - <<'PY'
                import hashlib
                import pathlib

                path = pathlib.Path("{{ item }}/tasks.md")
                print(hashlib.sha256(path.read_bytes()).hexdigest())
                PY

            - id: implement-convergence-findings
              type: if
              condition: "{{ steps.convergence-hash-before.output.stdout != steps.convergence-hash-after.output.stdout }}"

              then:
                - id: implement-convergence
                  command: speckit.implement
                  input:
                    args: >
                      speckit.converge appended remediation tasks. Implement
                      every newly-added convergence task completely. Do not
                      simply mark tasks complete. Inspect the implementation,
                      make the required production-quality changes, add or
                      update tests, and leave no known convergence task
                      unfinished.

        # ---------------------------------------------------------------------
        # HARD CONVERGENCE GUARD
        #
        # If the convergence loop exhausted its maximum iterations but another
        # converge pass still appends tasks, fail rather than pretending the
        # feature is finished.
        # ---------------------------------------------------------------------

        - id: convergence-guard-hash-before
          type: shell
          run: |
            python3 - <<'PY'
            import hashlib
            import pathlib

            path = pathlib.Path("{{ item }}/tasks.md")
            print(hashlib.sha256(path.read_bytes()).hexdigest())
            PY

        - id: convergence-guard
          command: speckit.converge
          input:
            args: >
              Perform one final strict convergence assessment. Append every
              remaining implementation gap. Do not declare convergence unless
              the actual code satisfies the complete feature contract.

        - id: convergence-guard-hash-after
          type: shell
          run: |
            python3 - <<'PY'
            import hashlib
            import pathlib

            path = pathlib.Path("{{ item }}/tasks.md")
            print(hashlib.sha256(path.read_bytes()).hexdigest())
            PY

        - id: fail-if-not-converged
          type: if
          condition: "{{ steps.convergence-guard-hash-before.output.stdout != steps.convergence-guard-hash-after.output.stdout }}"

          then:
            - id: convergence-failure
              type: shell
              run: |
                echo "ERROR: Feature failed to converge within the configured convergence limit." >&2
                echo "Additional remediation tasks were still discovered by the final guard pass." >&2
                exit 40

        # =====================================================================
        # FULL VERIFICATION
        # =====================================================================

        - id: verify
          type: shell
          run: "./scripts/verify"
          timeout: 3600
          continue_on_error: true

        # ---------------------------------------------------------------------
        # AUTONOMOUS TEST REPAIR
        #
        # Only entered when verification fails.
        # ---------------------------------------------------------------------

        - id: repair-verification-if-needed
          type: if
          condition: "{{ steps.verify.output.exit_code != 0 }}"

          then:

            - id: verification-repair-loop
              type: do-while
              condition: "{{ steps.verify-after-repair.output.exit_code != 0 }}"
              max_iterations: 5

              steps:

                - id: repair-verification
                  type: prompt
                  prompt: |
                    The repository verification command:

                        ./scripts/verify

                    is failing after implementation of the currently active
                    Spec Kit feature.

                    Diagnose and repair the failures.

                    Requirements:

                    - Run ./scripts/verify yourself and inspect the failures.
                    - Fix root causes rather than suppressing symptoms.
                    - Do not weaken, delete, skip, or disable legitimate tests.
                    - Do not reduce coverage thresholds.
                    - Do not remove lint/static-analysis/security checks.
                    - Do not alter the specification to excuse a failure.
                    - Do not introduce test-only production behavior.
                    - Preserve backward compatibility unless the spec explicitly
                      requires otherwise.
                    - Repair implementation, configuration, migrations,
                      generated artifacts, tests, or infrastructure as needed.
                    - Continue until you believe ./scripts/verify should pass.

                - id: verify-after-repair
                  type: shell
                  run: "./scripts/verify"
                  timeout: 3600
                  continue_on_error: true

        # ---------------------------------------------------------------------
        # VERIFICATION HARD GUARD
        # ---------------------------------------------------------------------

        - id: verification-final
          type: shell
          run: "./scripts/verify"
          timeout: 3600
          continue_on_error: true

        - id: fail-if-verification-still-broken
          type: if
          condition: "{{ steps.verification-final.output.exit_code != 0 }}"

          then:
            - id: verification-failure
              type: shell
              run: |
                echo "ERROR: Verification remains broken after autonomous repair attempts." >&2
                exit 41

        # =====================================================================
        # POST-TEST CONVERGENCE
        #
        # Test repair may have changed implementation. Re-converge so fixing
        # tests cannot accidentally cause specification drift.
        # =====================================================================

        - id: post-verification-convergence-loop
          type: do-while
          condition: "{{ steps.post-convergence-hash-before.output.stdout != steps.post-convergence-hash-after.output.stdout }}"
          max_iterations: 4

          steps:

            - id: post-convergence-hash-before
              type: shell
              run: |
                python3 - <<'PY'
                import hashlib
                import pathlib

                path = pathlib.Path("{{ item }}/tasks.md")
                print(hashlib.sha256(path.read_bytes()).hexdigest())
                PY

            - id: post-verification-converge
              command: speckit.converge
              input:
                args: >
                  Reassess the implementation after verification and test-repair
                  work. Append any remaining requirement, architecture,
                  correctness, security, testing, or operational gap.

            - id: post-convergence-hash-after
              type: shell
              run: |
                python3 - <<'PY'
                import hashlib
                import pathlib

                path = pathlib.Path("{{ item }}/tasks.md")
                print(hashlib.sha256(path.read_bytes()).hexdigest())
                PY

            - id: post-convergence-implementation-if-needed
              type: if
              condition: "{{ steps.post-convergence-hash-before.output.stdout != steps.post-convergence-hash-after.output.stdout }}"

              then:
                - id: post-convergence-implement
                  command: speckit.implement
                  input:
                    args: >
                      Implement every newly appended post-verification
                      convergence task completely and preserve the passing
                      verification state.

        # ---------------------------------------------------------------------
        # FINAL FEATURE VERIFICATION
        # ---------------------------------------------------------------------

        - id: final-feature-verification
          type: shell
          run: "./scripts/verify"
          timeout: 3600

  # ===========================================================================
  # FINAL WHOLE-PROJECT REGRESSION
  #
  # Every feature has now individually:
  #   plan/tasks
  #   analyzed
  #   implemented
  #   converged
  #   verified
  #   re-converged
  #
  # Run the repository verification suite one last time against the combined
  # result.
  # ===========================================================================

  - id: final-project-verification
    type: shell
    run: "./scripts/verify"
    timeout: 3600
