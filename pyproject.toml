[project]
name = "event-platform"
version = "0.1.0"
description = "Distributed event processing assessment service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1,<1",
  "python-dotenv>=1.2.3,<2",
  "pydantic>=2.13.5,<3",
  "pydantic-settings>=2.15.0,<3",
  "pymongo>=4.18.1,<5",
  "uvicorn>=0.53.0,<1",
  "elasticsearch[async]>=9.5.1,<10",
  "redis>=8.1.0,<9",
]

[dependency-groups]
dev = [
  "coverage>=7.16.1,<8",
  "httpx>=0.28.1,<1",
  "mypy>=1.20.2,<2",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "ruff>=0.16.8,<1",
]

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_platform"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/event_platform"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "unit: isolated foundation behavior",
  "functional: public HTTP contract tests without external services",
  "integration: tests with real external services",
  "e2e: black-box tests against a running application stack",
  "acceptance: executable architectural acceptance contracts",
  "failure: dependency and recovery failure scenarios",
  "performance: repeatable lightweight performance probes",
  "smoke: clean-stack smoke checks",
  "security: security and dependency hardening checks",
  "release: tagged release validation",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
