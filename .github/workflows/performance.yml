name: Bounded load validation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load:
    name: 500-event service-backed load profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: docker compose --env-file .env.example down -v --remove-orphans
      - run: make smoke
        env:
          SMOKE_DEADLINE_SECONDS: "180"
      - run: PERF_BASE_URL='http://127.0.0.1:8000' make performance-load
      - if: always()
        run: docker compose --env-file .env.example ps && docker compose --env-file .env.example logs --no-color > compose.log
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: bounded-load-${{ github.run_id }}
          path: |
            artifacts/performance-load.json
            compose.log
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        run: docker compose --env-file .env.example down -v --remove-orphans
