name: Release validation

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: make format-check
      - run: make lint
      - run: make typecheck
      - run: make dependency-check
      - run: make test-unit
      - run: make test-functional
      - run: make test-failure
      - run: make coverage
      - run: make compose-config
      - run: docker compose --env-file .env.example build
      - run: make release-verify
      - run: |
          {
            echo "### Release validation"
            echo "- version: ${GITHUB_REF_NAME}"
            echo "- commit: ${GITHUB_SHA}"
            echo "- artifacts: source archive, metadata, SHA-256 checksums, coverage XML"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: |
            artifacts/release
            coverage/coverage.xml
          retention-days: 30
