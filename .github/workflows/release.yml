name: Release validation

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: make format-check
      - run: make lint
      - run: make typecheck
      - run: make dependency-check
      - run: make test-unit
      - run: make test-functional
      - run: make test-failure
      - run: make coverage
      - run: make compose-config
      - run: docker compose --env-file .env.example build
      - run: make smoke
        env:
          SMOKE_DEADLINE_SECONDS: "180"
      - run: MONGO_URI='mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true' ELASTICSEARCH_URL='http://127.0.0.1:9200' REDIS_URL='redis://127.0.0.1:6379/0' make test-integration-required
      - run: MONGO_URI='mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true' ELASTICSEARCH_URL='http://127.0.0.1:9200' REDIS_URL='redis://127.0.0.1:6379/0' make test-acceptance-required
      - run: E2E_BASE_URL='http://127.0.0.1:8000' make test-e2e-required
      - run: make postman
      - run: PERF_BASE_URL='http://127.0.0.1:8000' PERF_REQUESTS=10 make performance
      - run: PERF_BASE_URL='http://127.0.0.1:8000' make performance-load
      - run: make release-verify
      - run: |
          {
            echo "### Release validation"
            echo "- version: ${GITHUB_REF_NAME}"
            echo "- commit: ${GITHUB_SHA}"
            echo "- artifacts: source archive, metadata, SHA-256 checksums, coverage XML"
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: docker compose --env-file .env.example logs --no-color > compose.log
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: release-${{ github.ref_name }}
          path: |
            artifacts/release
            coverage/coverage.xml
            artifacts/performance.json
            artifacts/performance-load.json
            compose.log
          retention-days: 30
      - if: always()
        run: docker compose --env-file .env.example down -v --remove-orphans
