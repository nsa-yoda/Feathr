name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: make format-check
      - run: make lint
      - run: make typecheck
      - run: make compose-config

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: make test-unit
      - run: make test-failure
      - run: make check-source-archive
      - run: uv run --locked coverage run --branch --source=src/event_platform -m pytest -q tests/unit
      - run: uv run --locked coverage report --show-missing --fail-under=90
      - run: uv run --locked coverage xml -o coverage/coverage.xml
      - run: docker compose --env-file .env.example up --build -d
      - run: MONGO_URI='mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true' ELASTICSEARCH_URL='http://127.0.0.1:9200' REDIS_URL='redis://127.0.0.1:6379/0' make test-integration-required
      - if: always()
        run: docker compose --env-file .env.example down -v
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage/coverage.xml
          if-no-files-found: ignore

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make compose-up
      - run: make smoke
      - if: always()
        run: make compose-down
